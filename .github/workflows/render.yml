name: Render Offcut shorts

on:
  repository_dispatch:
    types: [render_shorts]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-model-v1

      - name: Install Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Render shorts
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VOICE: ${{ vars.VOICE || 'am_michael' }}
          SPEED: ${{ vars.SPEED || '1.05' }}
        run: python render.py sample_shorts.json

      - name: Publish videos as a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="shorts-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" out/*.mp4 out/manifest.json \
            --title "Offcut shorts #${{ github.run_number }}" \
            --notes "Rendered automatically. Review, then schedule in Metricool."

      - name: Tell Make the shorts are ready
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python notify.py
